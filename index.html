<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Niam’s Site Update</title>
</head>
<body>
  <!-- Your normal site content would go here -->

  <script>
    // ===== Overlay Setup =====
    const overlay = document.createElement('div');
    overlay.style.cssText = `
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at center, #0a0a0a 0%, #000 100%);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 999999;
      color: #FFA500;
      font-family: 'Poppins', sans-serif;
      text-align: center;
      overflow: hidden;
    `;

    // ====== Excavator SVG ======
    const svg = document.createElement('div');
    svg.innerHTML = `
    <svg viewBox="0 0 400 250" width="400" height="250">
      <style>
        .base { fill: #111; stroke: #ff8c00; stroke-width: 2; }
        .arm { fill: none; stroke: #ff8c00; stroke-width: 8; stroke-linecap: round; transform-origin: 180px 150px; animation: armMove 3s ease-in-out infinite; }
        .bucket { fill: #ff8c00; transform-origin: 250px 190px; animation: bucketTilt 3s ease-in-out infinite; }
        .cabin { fill: #222; stroke: #ff8c00; stroke-width: 2; transform-origin: 120px 150px; animation: cabinTurn 6s ease-in-out infinite; }
        .dirt { fill: #ff8c00; opacity: 0; animation: dirtDrop 3s ease-in-out infinite; }
        @keyframes armMove {
          0%,100% { transform: rotate(0deg); }
          50% { transform: rotate(-25deg); }
        }
        @keyframes bucketTilt {
          0%,100% { transform: rotate(0deg); }
          50% { transform: rotate(-45deg); }
        }
        @keyframes cabinTurn {
          0%,100% { transform: rotate(0deg); }
          50% { transform: rotate(10deg); }
        }
        @keyframes dirtDrop {
          0%,100% { opacity: 0; transform: translateY(0); }
          50% { opacity: 1; transform: translateY(40px); }
        }
      </style>
      
      <!-- Excavator Body -->
      <rect x="80" y="140" width="100" height="60" class="base"/>
      <rect x="100" y="110" width="40" height="30" rx="5" class="cabin"/>
      
      <!-- Arm -->
      <line x1="180" y1="150" x2="250" y2="190" class="arm"/>
      
      <!-- Bucket -->
      <polygon points="250,190 260,200 240,200" class="bucket"/>
      
      <!-- Dirt -->
      <circle cx="260" cy="210" r="8" class="dirt"/>
    </svg>
    `;
    overlay.appendChild(svg);

    // ===== Text & Links =====
    const title = document.createElement('h1');
    title.textContent = "Niam is rebuilding this site";
    title.style.cssText = `
      font-size: 2.5rem;
      margin-top: 20px;
      text-shadow: 0 0 20px #ff8c00;
    `;

    const info = document.createElement('p');
    info.innerHTML = `
      Estimated launch: <b>11/3/25 @ 4:00PM</b><br>
      Might drop earlier if I’m cooking 🔥<br><br>
      <span style="opacity:0.8;">Bigger. Faster. Cleaner. Worth the wait.</span>
    `;
    info.style.cssText = `
      font-size: 1rem;
      margin: 10px 0 30px 0;
    `;

    const tempLink = document.createElement('a');
    tempLink.href = "https://issaquah-instructure-com.github.io/";
    tempLink.textContent = "Visit temporary site";
    tempLink.style.cssText = `
      color: #FFA500;
      text-decoration: none;
      font-weight: bold;
      border: 2px solid #FFA500;
      padding: 10px 20px;
      border-radius: 8px;
      transition: all 0.3s ease;
    `;
    tempLink.onmouseover = () => tempLink.style.background = '#FFA50022';
    tempLink.onmouseout = () => tempLink.style.background = 'transparent';

    const launchLink = document.createElement('a');
    launchLink.href = "https://macvg2025.github.io/launch/watch/";
    launchLink.textContent = "Watch the Launch";
    launchLink.style.cssText = `
      color: #FFA500;
      text-decoration: none;
      font-weight: bold;
      margin-top: 20px;
      display: inline-block;
      transition: all 0.3s ease;
    `;
    launchLink.onmouseover = () => launchLink.style.textShadow = '0 0 10px #FFA500';
    launchLink.onmouseout = () => launchLink.style.textShadow = 'none';

    overlay.append(title, info, tempLink, launchLink);
    document.body.appendChild(overlay);

    // ====== Sound ======
    const audio = new Audio('ty.mp3');
    audio.play().catch(() => console.warn("Autoplay blocked — user interaction required."));
  </script>
</body>
</html>
